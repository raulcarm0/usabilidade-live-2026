<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title></title>
        <link rel="stylesheet" href="css/exemplo_cep.css">
        <script type="text/javascript" src="js/exemplo_cep.js"></script>
    </head>
    <body>
        <main class="container">
            <header>
                <h2>Cadastro de Endereço</h2>
                <p>Digite o CEP e saia do campo para autopreencher.</p>
            </header>
            <form id="form-endereco">
                <div class="form-group">
                    <label for="cep" id="lblCep">CEP: </label>
                    <div class="input-wrapper">
                        <input type="text" id="cep" maxlength="9" placeholder="Digite seu CEP">
                        <span id="feedback" class="feedback"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label for="rua">Logradouro / Rua: </label>
                    <input type="text" id="rua" placeholder="Logradouro" readonly>
                </div>
                <div class="form-group">
                    <label for="numero">Número: </label>
                    <input type="text" id="numero" placeholder="Número">
                </div>
                <div class="form-group">
                    <label for="bairro">Bairro: </label>
                    <input type="text" id="bairro" placeholder="Bairro" readonly>
                </div>
                <div class="form-row">
                    <div class="form-group flex-3">
                        <label for="cidade">Cidade: </label>
                        <input type="text" id="cidade" placeholder="Cidade" readonly>
                    </div>
                    <div class="form-group flex-1">
                        <label for="uf">Estado (UF): </label>
                        <input type="text" id="uf" placeholder="UF" maxlength="2" readonly>
                    </div>
                </div>
 
                <button type="submit" id="btn-salvar">Salvar Cadastro</button>
            </form>
        </main>
    </body>
</html>
